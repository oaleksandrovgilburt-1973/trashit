<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Step 1: Phone -->
  <g transform="translate(40, 30)">
    <rect x="20" y="0" width="60" height="90" rx="8" fill="#4CAF50" stroke="#388E3C" stroke-width="1.5"/>
    <rect x="26" y="8" width="48" height="65" rx="4" fill="white"/>
    <circle cx="50" cy="82" r="4" fill="white"/>
    <circle cx="50" cy="30" r="12" fill="#4CAF50"/>
    <rect x="44" y="26" width="12" height="14" rx="2" fill="white"/>
    <rect x="42" y="24" width="16" height="4" rx="2" fill="white"/>
    <rect x="30" y="48" width="40" height="3" rx="1" fill="#e0e0e0"/>
    <rect x="30" y="55" width="30" height="3" rx="1" fill="#e0e0e0"/>
    <text x="50" y="108" text-anchor="middle" font-size="12" fill="#4CAF50" font-family="sans-serif">2 кликвания</text>
  </g>

  <line x1="155" y1="75" x2="195" y2="75" stroke="#4CAF50" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4,3"/>

  <!-- Step 2: Door -->
  <g transform="translate(195, 10)">
    <rect x="10" y="0" width="70" height="100" rx="4" fill="#8B6914" stroke="#6B4F10" stroke-width="1.5"/>
    <rect x="15" y="5" width="60" height="90" rx="3" fill="#A0784A"/>
    <circle cx="68" cy="55" r="4" fill="#FFD700"/>
    <ellipse cx="88" cy="95" rx="16" ry="12" fill="#2196F3" stroke="#1565C0" stroke-width="1"/>
    <path d="M78 88 Q88 78 98 88" fill="none" stroke="#1565C0" stroke-width="1.5"/>
  </g>

  <line x1="320" y1="75" x2="360" y2="75" stroke="#4CAF50" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4,3"/>

  <!-- Step 3: Worker -->
  <g transform="translate(360, 10)">
    <circle cx="50" cy="25" r="14" fill="#FF9800" stroke="#E65100" stroke-width="1.5"/>
    <rect x="36" y="13" width="28" height="8" rx="4" fill="#4CAF50"/>
    <rect x="40" y="8" width="20" height="8" rx="3" fill="#4CAF50"/>
    <rect x="38" y="39" width="24" height="30" rx="4" fill="#FF9800" stroke="#E65100" stroke-width="1"/>
    <line x1="44" y1="69" x2="40" y2="95" stroke="#E65100" stroke-width="4" stroke-linecap="round"/>
    <line x1="56" y1="69" x2="60" y2="95" stroke="#E65100" stroke-width="4" stroke-linecap="round"/>
    <line x1="38" y1="48" x2="20" y2="65" stroke="#E65100" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="16" cy="72" rx="12" ry="9" fill="#2196F3" stroke="#1565C0" stroke-width="1"/>
  </g>

  <line x1="485" y1="75" x2="525" y2="75" stroke="#4CAF50" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4,3"/>

  <!-- Step 4: Trash can -->
  <g transform="translate(525, 10)">
    <path d="M25 40 L30 100 Q30 108 40 108 L80 108 Q90 108 90 100 L95 40 Z" fill="#757575" stroke="#424242" stroke-width="1.5"/>
    <rect x="18" y="30" width="84" height="14" rx="5" fill="#616161" stroke="#424242" stroke-width="1.5"/>
    <rect x="48" y="20" width="24" height="12" rx="6" fill="#616161" stroke="#424242" stroke-width="1"/>
    <line x1="45" y1="45" x2="42" y2="102" stroke="#616161" stroke-width="2" stroke-linecap="round"/>
    <line x1="60" y1="45" x2="60" y2="102" stroke="#616161" stroke-width="2" stroke-linecap="round"/>
    <line x1="75" y1="45" x2="78" y2="102" stroke="#616161" stroke-width="2" stroke-linecap="round"/>
  </g>

</svg>
