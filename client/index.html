<!doctype html>
<html lang="bg">

  <head>
    <meta name="google-site-verification" content="-B5mDJUmy50v8IOcn1VpoMuKMtcO912IseorvPpu43I" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, viewport-fit=cover" />
    <title>TRASHit - Управление на отпадъци</title>
    <meta name="description" content="TRASHit - Платформа за управление на отпадъци и почистване в България" />

    <!-- PWA / Theme -->
    <meta name="theme-color" content="#4CAF50" />
    <link rel="manifest" href="/manifest.json" id="pwa-manifest" />
    <script>
      if (window.location.pathname.startsWith('/worker')) {
        document.getElementById('pwa-manifest').setAttribute('href', '/worker-manifest.json');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#FF6D00');
        document.querySelector('meta[name="apple-mobile-web-app-title"]').setAttribute('content', 'TRASHit Worker');
        document.title = 'TRASHit Worker';
      }
    </script>

    <!-- Android Chrome PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="TRASHit" />

    <!-- iOS Safari PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TRASHit" />

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <!-- Microsoft Tiles -->
    <meta name="msapplication-TileColor" content="#4CAF50" />
    <meta name="msapplication-TileImage" content="/icon-192.png" />
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TRASHit - Управление на отпадъци" />
    <meta property="og:description" content="Платформа за управление на отпадъци и почистване в България" />
    <meta property="og:image" content="https://trashit.bg/icon-512.png" />
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
